name: assozeta-dev

x-backend-dev: &backend-dev
  image: assozeta-backend-dev
  build:
    context: ../BE
    target: development
  env_file:
    - ${ASSOZETA_ENV_FILE:-.env.dev}
  init: true
  volumes:
    - ../BE:/app
    - dev_static:/app/staticfiles
  networks:
    - dev

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${DBNAME}
      POSTGRES_USER: ${DBUSER}
      POSTGRES_PASSWORD: ${DBPASSWORD}
    volumes:
      - dev_postgres:/var/lib/postgresql/data
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - dev_redis:/data
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 30

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - 127.0.0.1:${DEV_MINIO_CONSOLE_PORT:-59001}:9001
    volumes:
      - dev_minio:/data
    networks:
      - dev
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 30

  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z}
    profiles: [tools]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$AWS_STORAGE_BUCKET_NAME"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
    networks:
      - dev

  renderer:
    image: assozeta-renderer-dev
    build:
      context: renderer
    environment:
      RENDER_ALLOWED_HOSTS: api,minio,cdn.jsdelivr.net
    init: true
    shm_size: 1gb
    restart: unless-stopped
    networks:
      - dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend-dev
    profiles: [tools]
    command:
      - /bin/sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput --clear &&
        python manage.py seed_selfhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *backend-dev
    command: ["gunicorn", "core.asgi:application", "--worker-class", "uvicorn.workers.UvicornWorker", "--workers", "1", "--bind", "0.0.0.0:8000", "--reload", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-"]
    ports:
      - 127.0.0.1:${DEV_API_PORT:-8000}:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      renderer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/readyz"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  worker:
    <<: *backend-dev
    command: ["celery", "-A", "core", "worker", "--loglevel=info", "--pool=solo"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  beat:
    <<: *backend-dev
    command: ["celery", "-A", "core", "beat", "--loglevel=info", "--pidfile=/tmp/celerybeat.pid"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    image: assozeta-ui-dev
    build:
      context: ../UI
      target: development
    environment:
      VITE_DEV_HTTPS: "false"
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_WS_PROXY_TARGET: ws://api:8000
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      - ../UI:/app
      - dev_node_modules:/app/node_modules
    ports:
      - 127.0.0.1:${DEV_UI_PORT:-5001}:5001
    networks:
      - dev
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      start_period: 10s
      retries: 20

networks:
  dev:

volumes:
  dev_postgres:
  dev_redis:
  dev_minio:
  dev_static:
  dev_node_modules:
