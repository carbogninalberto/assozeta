name: ${COMPOSE_PROJECT_NAME:-assozeta}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-backend: &backend
  image: ${ASSOZETA_BACKEND_IMAGE:-ghcr.io/carbogninalberto/assozeta-backend}:${ASSOZETA_VERSION:-latest}
  env_file:
    - ${ASSOZETA_ENV_FILE:-.env}
  init: true
  volumes:
    - django_static:/app/staticfiles
  networks:
    - internal
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${DBNAME}
      POSTGRES_USER: ${DBUSER}
      POSTGRES_PASSWORD: ${DBPASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *default-logging

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z}
    profiles: [tools]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$AWS_STORAGE_BUCKET_NAME"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
    networks:
      - internal
    logging: *default-logging

  renderer:
    image: ${ASSOZETA_RENDERER_IMAGE:-ghcr.io/carbogninalberto/assozeta-renderer}:${ASSOZETA_VERSION:-latest}
    environment:
      RENDER_ALLOWED_HOSTS: api,minio,cdn.jsdelivr.net
    init: true
    shm_size: 1gb
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    <<: *backend
    profiles: [tools]
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput --clear &&
        python manage.py seed_selfhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      renderer:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  worker:
    <<: *backend
    command: ["celery", "-A", "core", "worker", "--loglevel=info", "--max-tasks-per-child=50", "--concurrency=${CELERY_CONCURRENCY:-2}", "--prefetch-multiplier=2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      disable: true

  beat:
    <<: *backend
    command: ["celery", "-A", "core", "beat", "--loglevel=info", "--pidfile=/tmp/celerybeat.pid"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      disable: true

  web:
    image: ${ASSOZETA_WEB_IMAGE:-ghcr.io/carbogninalberto/assozeta-web}:${ASSOZETA_VERSION:-latest}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL:-localhost@example.invalid}
    ports:
      - ${HTTP_PORT:-80}:${HTTP_PORT:-80}
      - ${HTTPS_PORT:-443}:${HTTPS_PORT:-443}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - django_static:/django-static:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pidof caddy >/dev/null 2>&1 && caddy validate --config /etc/caddy/Caddyfile >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  minio_data:
  django_static:
  caddy_data:
  caddy_config:
