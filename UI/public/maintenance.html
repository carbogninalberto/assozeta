<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#351dc2">
  <title>Manutenzione in corso · Assozeta</title>
  <style>
    :root { color-scheme: light; --primary: #351dc2; --primary-text: #351dc2; --on-primary: #fff; --background: #f5f4fb; --surface: #fff; --text: #181c32; --muted: #62677b; --border: #e7e4f2; }
    [data-theme="dark"] { color-scheme: dark; --primary: #7c7cf8; --primary-text: #a9a9ff; --on-primary: #131320; --background: #131320; --surface: #1b1b2d; --text: #e1e2e8; --muted: #a0a3bd; --border: #35354f; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: 24px; background: var(--background); color: var(--text); font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 480px); padding: clamp(28px, 7vw, 48px); border: 1px solid var(--border); border-radius: 24px; background: var(--surface); box-shadow: 0 20px 55px rgba(24, 28, 50, .08); text-align: center; }
    .icon { display: grid; place-items: center; width: 80px; height: 80px; margin: 0 auto 26px; border-radius: 22px; background: color-mix(in srgb, var(--primary) 12%, var(--surface)); color: var(--primary-text); }
    .icon svg { width: 42px; height: 42px; }
    .eyebrow { margin: 0 0 10px; color: var(--primary-text); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(25px, 6vw, 34px); line-height: 1.18; letter-spacing: -.035em; }
    p { margin: 18px 0 30px; color: var(--muted); }
    .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 12px 22px; border: 0; border-radius: 11px; background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 700; cursor: pointer; }
    .btn-primary:hover { filter: brightness(.94); }
    .btn-primary:focus-visible { outline: 3px solid var(--primary); outline-offset: 4px; }
    .btn-primary svg { width: 19px; height: 19px; }
  </style>
  <script>
    try {
      const user = JSON.parse(localStorage.getItem('userData') || '{}');
      const dark = user.dark_mode ?? matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.dataset.theme = 'dark';
      const palette = JSON.parse(localStorage.getItem('assozeta_brand_palette') || 'null');
      const colors = palette?.[dark ? 'dark' : 'light'];
      for (const key of ['--primary', '--primary-text', '--on-primary']) {
        if (/^#[0-9a-f]{6}$/i.test(colors?.[key] || '')) document.documentElement.style.setProperty(key, colors[key]);
      }
      if (/^#[0-9a-f]{6}$/i.test(colors?.['--brand-color'] || '')) {
        document.querySelector('meta[name="theme-color"]').content = colors['--brand-color'];
      }
    } catch { /* The default colors work without local storage. */ }
  </script>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="14"/><circle cx="24" cy="24" r="5"/><path d="M24 4v6m0 28v6M4 24h6m28 0h6M10 10l4 4m20 20 4 4m0-28-4 4M14 34l-4 4"/></svg>
    </div>
    <div class="eyebrow">Manutenzione in corso</div>
    <h1>Torniamo tra poco</h1>
    <p>L’applicazione è temporaneamente non disponibile per manutenzione. Riprova tra qualche minuto.</p>
    <button class="btn-primary" type="button" onclick="location.pathname === '/maintenance.html' ? location.replace('/' + location.hash) : location.reload()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2 6"/><path d="M20 4v7h-7"/></svg>
      Riprova
    </button>
  </main>
</body>
</html>
