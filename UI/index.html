	<!-- Prevent flash of wrong theme on page load + Android native detection -->
	<script>
		(function() {
			try {
				var sessionToken = localStorage.getItem('sessionToken');
				if (!sessionToken || sessionToken === 'null') return;
				var userData = JSON.parse(localStorage.getItem('userData') || '{}');
				if (userData.dark_mode) {
					document.documentElement.setAttribute('data-theme', 'dark');
				} else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches && userData.dark_mode === undefined) {
					// Optionally follow system preference if user hasn't set a preference
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			} catch(e) {}
			// Detect Android Capacitor app early to prevent header flash
			if (/Android/i.test(navigator.userAgent) && (location.hostname === 'localhost' || location.protocol === 'capacitor:')) {
				document.documentElement.classList.add('android-native');
				document.documentElement.style.setProperty('--android-status-bar-height', '24px');
			}
		})();
	</script>

	<script>
		window.onerror = function(event) {
			// Redirect the user to an error page or another URL
			// window.location.href = '/error.html';

			// redirect only if a svelte error is thrown
			if (event?.message?.includes('Cannot read property')
				|| event?.message?.includes('SyntaxError')) {
				window.location.href = '/error.html';
			}

			// Prevent the default error handling behavior
			return true;
		};
		if (localStorage.getItem('userData') == 'null') localStorage.clear();
	</script>
