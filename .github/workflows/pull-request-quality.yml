name: Pull request quality

on:
  pull_request:
    # Always report the final check, including for documentation-only PRs.

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      golang: ${{ steps.filter.outputs.golang }}
      backend: ${{ steps.filter.outputs.backend }}
      ui: ${{ steps.filter.outputs.ui }}
      selfhost: ${{ steps.filter.outputs.selfhost }}
      stack: ${{ steps.filter.outputs.stack }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            golang:
              - '{BE_GO/**,BE/**,TESTS/**,docs/architecture/go-migration/**,.github/workflows/pull-request-quality.yml}'
              - '!**/*.md'
            backend:
              - '{BE/**,TESTS/**,run_tests.sh,selfhost/compose.dev.yml,selfhost/bin/assozeta,selfhost/config/**,selfhost/.env*,.github/workflows/selfhost-quality.yml,.github/actions/prepare-storage/**,.github/workflows/pull-request-quality.yml}'
              - '!**/*.md'
            ui:
              - '{UI/**,selfhost/tests/browser/**,.github/workflows/selfhost-quality.yml,.github/actions/prepare-storage/**,.github/workflows/pull-request-quality.yml}'
              - '!**/*.md'
            selfhost:
              - '{selfhost/**,BE/instance/**,BE/Dockerfile,BE/entrypoint.sh,UI/Dockerfile,UI/Caddyfile,Makefile,run_tests.sh,.github/workflows/selfhost-quality.yml,.github/actions/prepare-storage/**,.github/workflows/pull-request-quality.yml}'
              - '!**/*.md'
              - '!selfhost/tests/browser/**'
            stack:
              # Stack/upgrade changes require integration coverage; ordinary
              # BE/UI changes run only their component suites.
              - '{selfhost/**,Makefile}'
              - '!**/*.md'
              # Browser dependencies/config and self-instance.spec.js also
              # exercise the upgrade suite; standalone fixtures do not.
              - '!selfhost/tests/browser/{operations-ui.mjs,staff-board-ui.mjs,calendar-security.mjs,bakney-sso.mjs}'
              - '!selfhost/tests/test_*.py'
            workflows:
              - '.github/workflows/**'

  golang:
    name: Go foundation and inventory
    needs: changes
    if: needs.changes.outputs.golang == 'true'
    runs-on: ubuntu-24.04
    # The expanded real-Django/Go suite plus setup/image checks exceeds 15 min.
    # Individual adapters retain their own bounded subprocess deadlines.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: BE_GO/go.mod
          cache-dependency-path: BE_GO/go.sum
      - name: Check inventory and Go code
        run: |
          python3 -m unittest discover -s TESTS/inventory -v
          python3 -m TESTS.inventory.catalog --check
          test -z "$(gofmt -l BE_GO)"
          go -C BE_GO vet ./...
          go -C BE_GO test -race ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.2'
          cache: pip
          cache-dependency-path: |
            BE/requirements.txt
            TESTS/adapters/django/requirements-credentials.txt
      - name: Verify environment, credentials and provider protocols
        run: |
          python TESTS/adapters/django/production_runtime.py
          python -m pip install -r TESTS/adapters/django/requirements-credentials.txt
          python TESTS/adapters/django/environment.py
          python TESTS/adapters/django/credentials.py
          python TESTS/adapters/django/permissions.py
          python TESTS/adapters/django/apple_tokens.py
          python TESTS/adapters/django/google_tokens.py
      - name: Install disposable integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 redis-server locales build-essential pkg-config libjpeg-dev zlib1g-dev
          sudo sed -i 's/^# *it_IT.UTF-8 UTF-8/it_IT.UTF-8 UTF-8/' /etc/locale.gen
          sudo locale-gen
          python -c "import locale; locale.setlocale(locale.LC_ALL, 'it_IT.UTF-8')"
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Verify Django impersonation cache interoperability
        run: python TESTS/adapters/django/impersonation_cache.py
      - name: Verify login admission and shared rate counters
        run: python TESTS/adapters/django/login_rate.py
      - name: Verify CORS HTTP and URL comparison policy
        run: python TESTS/adapters/django/cors.py
      - name: Verify current Django security headers
        run: python TESTS/adapters/django/security_headers.py
      - name: Verify shared accounts, identities and scoped resources
        run: python TESTS/adapters/django/accounts.py
      - name: Verify transactional durable jobs and lease recovery
        run: python TESTS/adapters/go/jobs.py
      - name: Check native PNG decoder with sanitizers
        run: python TESTS/adapters/go/login_png_sanitizer.py
      - name: Rehearse health and dependency failure recovery
        run: python3 TESTS/adapters/go/health.py
      - name: Build isolated Go image and verify non-root execution
        run: |
          docker build -t assozeta-go-foundation:test BE_GO
          test "$(docker run --rm --network none --entrypoint id assozeta-go-foundation:test -u)" = "10001"
          python TESTS/adapters/go/login_jpeg_image.py --image assozeta-go-foundation:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-foundation-evidence
          path: |
            quality-reports/go-migration/go-health/
            quality-reports/go-migration/credentials.json
            quality-reports/go-migration/permissions.json
            quality-reports/go-migration/impersonation-cache/
            quality-reports/go-migration/login-rate/
            quality-reports/go-migration/cors/
            quality-reports/go-migration/security-headers/
            quality-reports/go-migration/environment/
            quality-reports/go-migration/restore-admission/
            quality-reports/go-migration/runtime.json
            quality-reports/go-migration/jobs/
            quality-reports/go-migration/job-executor/
            quality-reports/go-migration/email-balance-reset/
            quality-reports/go-migration/subscription-token-cleanup/
            quality-reports/go-migration/associate-age-update/
            quality-reports/go-migration/audit-retention/
            quality-reports/go-migration/task-bodies/
            quality-reports/go-migration/accounts/

  quality:
    name: Run affected quality checks
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.stack == 'true'
    uses: ./.github/workflows/selfhost-quality.yml
    with:
      run_operations: ${{ needs.changes.outputs.backend == 'true' }}
      run_ui: ${{ needs.changes.outputs.ui == 'true' }}
      run_upgrade: ${{ needs.changes.outputs.stack == 'true' }}

  selfhost:
    name: Self-host static validation
    needs: changes
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make selfhost-test

  stack:
    name: Self-host development and production smoke
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make selfhost-smoke
      - run: make selfhost-production-smoke

  workflows:
    name: Validate GitHub Actions workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=

  result:
    name: PR quality
    if: always()
    needs: [changes, golang, quality, selfhost, stack, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['changes']['result'] == 'success', results
          assert all(job['result'] in ('success', 'skipped') for job in results.values()), results
          PY
