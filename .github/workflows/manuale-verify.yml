name: Verify and package compatible manual

# Modes B (incremental behavioral) and C (comprehensive release) share this
# verifier. `comprehensive` defaults to true: a caller must opt out explicitly,
# and only a comprehensive run that passes the final gate is authorized.
on:
  workflow_call:
    inputs:
      release:
        required: true
        type: string
      manual_revision:
        description: Optional immutable authoring revision; defaults to the committed source pin
        type: string
        default: ''
      force_full:
        type: boolean
        default: false
      comprehensive:
        description: Release verification (Mode C); always rehearses the full historical appliance
        type: boolean
        default: true
      run_contracts:
        description: Run verifier contract suites here (the caller may run them in parallel itself)
        type: boolean
        default: true
      workflows:
        description: Comma-separated workflow ids the impact analysis selected (added to baseline selection)
        type: string
        default: ''
      appliance:
        description: Run the packaged appliance checks when not comprehensive
        type: boolean
        default: true
      impact:
        description: Read the manuale-impact artifact of this run (never used for comprehensive runs)
        type: boolean
        default: false
    outputs:
      mode:
        value: ${{ jobs.verify.outputs.mode }}
      appliance_scope:
        value: ${{ jobs.verify.outputs.appliance_scope }}
      authorized:
        description: true only when every mandatory job and check of this run succeeded
        value: ${{ jobs.gate.outputs.authorized }}

permissions:
  contents: read
  actions: read

jobs:
  contracts:
    name: Verifier, browser-helper, Bot and MCP contracts
    if: ${{ inputs.run_contracts || inputs.comprehensive }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: selfhost/tests/browser/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            docs/manuale/requirements-offline.txt
            BE/requirements.txt
            BE/requirements-test.txt
      - name: Record stage timings for this job
        run: echo "MANUALE_TIMING_FILE=$RUNNER_TEMP/manuale-timing.jsonl" >> "$GITHUB_ENV"
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('selfhost/tests/browser/package-lock.json') }}
      - name: Install contract dependencies
        run: >-
          python3 docs/scripts/manuale_timing.py stage install-dependencies --
          bash -c 'python3 -m pip install -r docs/manuale/requirements-offline.txt -r BE/requirements.txt -r BE/requirements-test.txt
          && npm --prefix selfhost/tests/browser ci
          && npm exec --prefix selfhost/tests/browser -- playwright install --with-deps chromium'
      - name: Validate local source mappings and deterministic recipe behavior
        run: python3 docs/scripts/manuale-ci.py offline --suite python
      - name: Verify browser capture helpers and dropdown behavior
        run: python3 docs/scripts/manuale-ci.py offline --suite node --with-browser
      - name: Check manual, Bot and MCP tool contracts offline
        run: python3 docs/scripts/manuale-ci.py offline --suite bot-mcp
      - name: Summarize contract timings
        if: always()
        run: python3 docs/scripts/manuale_timing.py summary --title 'Manual contracts'

  # Opt-in distributed capture: only fresh, full runs, and only when the
  # repository variable names 2..6 runners. The default ('1') never runs this
  # job, so every existing caller keeps the single-runner verifier untouched.
  capture-plan:
    name: Plan distributed capture
    if: ${{ inputs.force_full && (vars.MANUALE_CAPTURE_RUNNERS || '1') != '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      shard_count: ${{ steps.transport.outputs.shard_count }}
      matrix: ${{ steps.transport.outputs.matrix }}
      capture_id: ${{ steps.transport.outputs.capture_id }}
      manual_revision: ${{ steps.pin.outputs.manual_revision }}
    env:
      RELEASE_VERSION: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: selfhost/tests/browser/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/manuale/requirements-offline.txt
      - name: Record stage timings for this job
        run: echo "MANUALE_TIMING_FILE=$RUNNER_TEMP/manuale-timing.jsonl" >> "$GITHUB_ENV"
      - name: Pin immutable manual authoring input
        id: pin
        env:
          MANUAL_REVISION: ${{ inputs.manual_revision }}
        run: >-
          python3 docs/scripts/manuale-ci.py pin
          --manual-repo "$RUNNER_TEMP/manuale"
          --manual-revision "$MANUAL_REVISION"
          --output "$RUNNER_TEMP/manual-source.json"
      - uses: ./.github/actions/prepare-storage
      - name: Install planning dependencies
        # The plan only snapshots inputs and computes the workflow inventory.
        run: >-
          python3 docs/scripts/manuale_timing.py stage install-dependencies --
          bash -c 'python3 -m pip install -r docs/manuale/requirements-offline.txt'
      - name: Validate the distributed capture runner count
        env:
          RUNNERS: ${{ vars.MANUALE_CAPTURE_RUNNERS }}
        run: |
          if [[ ! "$RUNNERS" =~ ^[0-9]+$ ]] || (( 10#$RUNNERS < 2 || 10#$RUNNERS > 6 )); then
            echo "::error::MANUALE_CAPTURE_RUNNERS must be an integer from 2 to 6 (got '$RUNNERS'); use '1' or unset it to capture on a single runner."
            exit 1
          fi
      - name: Plan every workflow as fresh
        # No services start here: this run only mints the transport manifest and
        # is never used again after this job.
        run: >-
          python3 docs/scripts/manuale-ci.py prepare
          --manual-repo "$RUNNER_TEMP/manuale" --release "$RELEASE_VERSION"
          --output "$RUNNER_TEMP/manuale-plan-run" --force-full
      - name: Mint the distributed capture transport
        id: transport
        env:
          RUNNERS: ${{ vars.MANUALE_CAPTURE_RUNNERS }}
        run: >-
          python3 docs/scripts/manuale-ci.py transport
          --run "$RUNNER_TEMP/manuale-plan-run" --runners "$RUNNERS"
          --output "$RUNNER_TEMP/manuale-transport"
      - name: Upload the capture transport manifest
        uses: actions/upload-artifact@v4
        with:
          name: manuale-capture-transport
          path: ${{ runner.temp }}/manuale-transport/transport.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Remove only this run's fixture services
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/manuale-plan-run/run.json" ]]; then
            python3 docs/scripts/manuale-ci.py phase --run "$RUNNER_TEMP/manuale-plan-run" --phase cleanup
          fi

  capture:
    name: Capture shard ${{ matrix.index }}
    needs: capture-plan
    if: ${{ needs.capture-plan.result == 'success' && needs.capture-plan.outputs.shard_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.capture-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: selfhost/tests/browser/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/manuale/requirements-offline.txt
      - name: Record stage timings for this job
        run: echo "MANUALE_TIMING_FILE=$RUNNER_TEMP/manuale-timing.jsonl" >> "$GITHUB_ENV"
      - uses: ./.github/actions/prepare-storage
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('selfhost/tests/browser/package-lock.json') }}
      - name: Install verifier dependencies
        run: >-
          python3 docs/scripts/manuale_timing.py stage install-dependencies --
          bash -c 'python3 -m pip install -r docs/manuale/requirements-offline.txt
          && npm --prefix selfhost/tests/browser ci
          && npm exec --prefix selfhost/tests/browser -- playwright install --with-deps chromium'
      - name: Check verifier runtime and browser helper contracts
        run: |
          python3 docs/scripts/manuale_timing.py stage doctor -- python3 docs/scripts/manuale.py doctor
          python3 docs/scripts/manuale-ci.py offline --suite node --with-browser
      - name: Pin immutable manual authoring input
        id: pin
        env:
          MANUAL_REVISION: ${{ inputs.manual_revision }}
        run: >-
          python3 docs/scripts/manuale-ci.py pin
          --manual-repo "$RUNNER_TEMP/manuale"
          --manual-revision "$MANUAL_REVISION"
          --output "$RUNNER_TEMP/manual-source.json"
      - name: Require the manual revision of the capture plan
        # The materialized pin is a pure function of the vendored tree; the
        # shard and the merge both reject any other revision.
        env:
          PLANNED_REVISION: ${{ needs.capture-plan.outputs.manual_revision }}
          PINNED_REVISION: ${{ steps.pin.outputs.manual_revision }}
        run: |
          if [[ "$PINNED_REVISION" != "$PLANNED_REVISION" ]]; then
            echo '::error::This shard pinned a different manual revision than the distributed capture plan.'
            exit 1
          fi
      - name: Download the capture transport manifest
        uses: actions/download-artifact@v4
        with:
          name: manuale-capture-transport
          path: ${{ runner.temp }}/manuale-transport
      - name: Capture exactly this shard
        run: >-
          python3 docs/scripts/manuale-ci.py capture-shard
          --transport "$RUNNER_TEMP/manuale-transport/transport.json"
          --shard ${{ matrix.index }}
          --manual-repo "$RUNNER_TEMP/manuale"
          --output "$RUNNER_TEMP/manuale-shard"
      - name: Export this shard's sanitized capture results
        run: >-
          python3 docs/scripts/manuale-ci.py capture-export
          --run "$RUNNER_TEMP/manuale-shard"
          --transport "$RUNNER_TEMP/manuale-transport/transport.json"
          --shard ${{ matrix.index }}
          --output "$RUNNER_TEMP/manuale-shard-export"
      - name: Retain this shard's capture results
        # Success only: a shard that failed must never look like a captured one.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/manuale-shard-export/
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Remove only this run's fixture services
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/manuale-shard/run.json" ]]; then
            python3 docs/scripts/manuale-ci.py phase --run "$RUNNER_TEMP/manuale-shard" --phase cleanup
          fi
      - name: Export sanitized diagnostics
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/manuale-shard" ]]; then
            python3 docs/scripts/manuale-diagnostics.py --run "$RUNNER_TEMP/manuale-shard"
          fi
      - name: Retain shard diagnostics and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuale-capture-diag-${{ needs.capture-plan.outputs.capture_id }}-s${{ matrix.index }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/manuale-shard/diagnostics-public/
            ${{ runner.temp }}/manuale-timing.jsonl
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
      - name: Summarize shard timings
        if: always()
        run: python3 docs/scripts/manuale_timing.py summary --title 'Manual capture shard'

  verify:
    name: Select, verify and package manual content
    needs: [capture-plan, capture]
    # Runs after a skipped or failed distributed plan too, so the gate still
    # reports why nothing was verified instead of silently succeeding.
    if: >-
      ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.capture-plan.result) &&
          contains(fromJSON('["success","skipped"]'), needs.capture.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      historical_rehearsal: ${{ steps.plan.outputs.historical_rehearsal }}
      manual_revision: ${{ steps.pin.outputs.manual_revision }}
      comprehensive: ${{ inputs.comprehensive }}
      appliance_scope: ${{ (inputs.comprehensive || github.event_name == 'schedule' || steps.plan.outputs.historical_rehearsal == 'true') && 'full' || 'compatibility' }}
      appliance_required: ${{ inputs.comprehensive || inputs.appliance || github.event_name == 'schedule' || steps.plan.outputs.historical_rehearsal == 'true' }}
      release_binding: ${{ steps.binding.outputs.release_binding }}
      release_binding_release: ${{ steps.binding.outputs.release_binding_release }}
      release_binding_revision: ${{ steps.binding.outputs.release_binding_revision }}
    env:
      RELEASE_VERSION: ${{ inputs.release }}
      # Capture shards (1..4 or auto). Sequential by default: on 4 vCPU hosted
      # runners two concurrent stacks made unrelated workflows time out and were
      # not faster. Opt in with vars.MANUALE_CAPTURE_CONCURRENCY on larger runners.
      MANUALE_CAPTURE_CONCURRENCY: ${{ vars.MANUALE_CAPTURE_CONCURRENCY || '1' }}
      # Opt-in BuildKit layer cache for run-owned images (set the variable to gha).
      MANUALE_BUILDX_CACHE: ${{ vars.MANUALE_BUILDX_CACHE || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: selfhost/tests/browser/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/manuale/requirements-offline.txt
      - name: Record stage timings for this job
        run: echo "MANUALE_TIMING_FILE=$RUNNER_TEMP/manuale-timing.jsonl" >> "$GITHUB_ENV"
      - name: Detect a distributed capture plan
        env:
          SHARD_COUNT: ${{ needs.capture-plan.outputs.shard_count }}
        run: |
          if [[ -n "$SHARD_COUNT" && "$SHARD_COUNT" != '0' ]]; then
            echo 'DISTRIBUTED=true' >> "$GITHUB_ENV"
          else
            echo 'DISTRIBUTED=false' >> "$GITHUB_ENV"
          fi
      - name: Download the impact plan
        if: ${{ inputs.impact && !inputs.comprehensive }}
        uses: actions/download-artifact@v4
        with:
          name: manuale-impact
          path: ${{ runner.temp }}/manuale-impact
      - name: Expose the GitHub cache service to BuildKit
        if: ${{ vars.MANUALE_BUILDX_CACHE == 'gha' }}
        uses: crazy-max/ghaction-github-runtime@v3
      - name: Set up a BuildKit builder for run-owned images
        id: buildx
        if: ${{ vars.MANUALE_BUILDX_CACHE == 'gha' }}
        uses: docker/setup-buildx-action@v3
        with:
          # Keep the default builder for every other docker build in this job.
          use: false
      - name: Pin immutable manual authoring input
        id: pin
        env:
          MANUAL_REVISION: ${{ inputs.manual_revision }}
        run: >-
          python3 docs/scripts/manuale-ci.py pin
          --manual-repo "$RUNNER_TEMP/manuale"
          --manual-revision "$MANUAL_REVISION"
          --output "$RUNNER_TEMP/manual-source.json"
      - name: Require the manual revision of the capture plan
        # The distributed shards pinned this plan's revision; the merge rejects
        # anything else, so fail here with the exact reason first.
        if: ${{ env.DISTRIBUTED == 'true' }}
        env:
          PLANNED_REVISION: ${{ needs.capture-plan.outputs.manual_revision }}
          PINNED_REVISION: ${{ steps.pin.outputs.manual_revision }}
        run: |
          if [[ "$PINNED_REVISION" != "$PLANNED_REVISION" ]]; then
            echo '::error::This run pinned a different manual revision than the distributed capture plan.'
            exit 1
          fi
      - uses: ./.github/actions/prepare-storage
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('selfhost/tests/browser/package-lock.json') }}
      - name: Install verifier dependencies
        run: >-
          python3 docs/scripts/manuale_timing.py stage install-dependencies --
          bash -c 'python3 -m pip install -r docs/manuale/requirements-offline.txt
          && npm --prefix selfhost/tests/browser ci
          && npm exec --prefix selfhost/tests/browser -- playwright install --with-deps chromium'
      - name: Check verifier runtime and browser helper contracts
        run: |
          python3 docs/scripts/manuale_timing.py stage doctor -- python3 docs/scripts/manuale.py doctor
          python3 docs/scripts/manuale-ci.py offline --suite node --with-browser
      - name: Admit a successful trusted baseline
        if: ${{ !inputs.force_full }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 docs/scripts/manuale-ci.py baseline
          --manual-repo "$RUNNER_TEMP/manuale"
          --output "$RUNNER_TEMP/manuale-baseline"
      - name: Restore trusted per-workflow evidence (manifests first, screenshots only when reusable)
        id: store
        if: ${{ !inputs.force_full }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPREHENSIVE: ${{ inputs.comprehensive }}
        run: |
          options=()
          # Affected workflows are always captured fresh; release runs reuse
          # only fingerprint-identical evidence and still run every check.
          if [[ "$COMPREHENSIVE" != true && -f "$RUNNER_TEMP/manuale-impact/impact.json" ]]; then
            options+=(--impact "$RUNNER_TEMP/manuale-impact/impact.json")
          fi
          python3 docs/scripts/manuale-ci.py store --output "$RUNNER_TEMP/manuale-store" "${options[@]}"
      - name: Explain fresh, reused and unaffected work
        id: plan
        env:
          FORCE_FULL: ${{ inputs.force_full }}
          SELECTED_WORKFLOWS: ${{ inputs.workflows }}
          COMPREHENSIVE: ${{ inputs.comprehensive }}
          STORE_SELECTION: ${{ steps.store.outputs.store_selection }}
        run: |
          options=()
          if [[ "$FORCE_FULL" == true ]]; then options+=(--force-full); fi
          if [[ -n "$SELECTED_WORKFLOWS" ]]; then options+=(--workflow "$SELECTED_WORKFLOWS"); fi
          # Release verification never narrows its scope from a change analysis.
          if [[ "$COMPREHENSIVE" != true && -f "$RUNNER_TEMP/manuale-impact/impact.json" ]]; then
            options+=(--impact "$RUNNER_TEMP/manuale-impact/impact.json")
          fi
          # Store evidence is admitted again by the verifier's own gate; only the
          # remaining workflows are captured (with MANUALE_CAPTURE_CONCURRENCY shards).
          if [[ "$STORE_SELECTION" == true ]]; then
            options+=(--evidence-selection "$RUNNER_TEMP/manuale-store/selection")
          fi
          python3 docs/scripts/manuale-ci.py prepare \
            --manual-repo "$RUNNER_TEMP/manuale" --baseline "$RUNNER_TEMP/manuale-baseline" \
            --release "$RELEASE_VERSION" --output "$RUNNER_TEMP/manuale-run" "${options[@]}"
      - name: Select the caching builder for run-owned Compose images
        # Set only after storage preparation; later steps build only via Compose.
        if: ${{ vars.MANUALE_BUILDX_CACHE == 'gha' }}
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: echo "BUILDX_BUILDER=$BUILDER" >> "$GITHUB_ENV"
      - name: Download the distributed capture plan
        if: ${{ env.DISTRIBUTED == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: manuale-capture-transport
          path: ${{ runner.temp }}/manuale-transport
      - name: Download every captured shard
        # merge-multiple keeps one subdirectory per shard artifact, exactly the
        # layout the merge validates.
        if: ${{ env.DISTRIBUTED == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: manuale-capture-${{ needs.capture-plan.outputs.capture_id }}-s*
          path: ${{ runner.temp }}/manuale-shards
          merge-multiple: false
      - name: Capture only workflows requiring fresh evidence
        if: ${{ env.DISTRIBUTED != 'true' }}
        run: python3 docs/scripts/manuale-ci.py phase --run "$RUNNER_TEMP/manuale-run" --phase capture
      - name: Merge the distributed capture shards
        if: ${{ env.DISTRIBUTED == 'true' }}
        run: >-
          python3 docs/scripts/manuale-ci.py phase --run "$RUNNER_TEMP/manuale-run"
          --phase capture --transport "$RUNNER_TEMP/manuale-transport/transport.json"
          --shards "$RUNNER_TEMP/manuale-shards"
      - name: Compile complete content and verify source evidence
        run: python3 docs/scripts/manuale-ci.py phase --run "$RUNNER_TEMP/manuale-run" --phase compile
      - name: Verify changed pages and retain compatible render evidence
        run: python3 docs/scripts/manuale-ci.py phase --run "$RUNNER_TEMP/manuale-run" --phase render
      - name: Check current reader, access control, MCP and assistant
        run: python3 docs/scripts/manuale-ci.py phase --run "$RUNNER_TEMP/manuale-run" --phase runtime
      - name: Bind package to the exact application revision and release
        run: >-
          python3 docs/scripts/manuale-ci.py phase --run "$RUNNER_TEMP/manuale-run"
          --phase package --package-output "$RUNNER_TEMP/manuale-package"
      - name: Bind every workflow's evidence to this exact release identity
        run: >-
          python3 docs/scripts/manuale_timing.py stage evidence-release-binding --
          python3 docs/scripts/manuale-cache.py store-bind --run "$RUNNER_TEMP/manuale-run"
          --output "$RUNNER_TEMP/manuale-run/release-binding.json"
      - name: Verify the release binding against this exact release identity
        # Fails unless release-binding.json exists, is intact, names this commit,
        # the pinned manual revision and this version, and equals the binding
        # recomputed from the run's evidence. The gate requires it for Mode C.
        id: binding
        env:
          MANUAL_REVISION: ${{ steps.pin.outputs.manual_revision }}
          APPLICATION_REVISION: ${{ github.sha }}
        run: |
          python3 docs/scripts/manuale-cache.py store-verify-binding --run "$RUNNER_TEMP/manuale-run" \
            --binding "$RUNNER_TEMP/manuale-run/release-binding.json" \
            --application-revision "$APPLICATION_REVISION" --manual-revision "$MANUAL_REVISION" \
            --release "$RELEASE_VERSION" --output "$RUNNER_TEMP/manuale-run/release-binding-verification.json"
          {
            echo 'release_binding=verified'
            echo "release_binding_release=$RELEASE_VERSION"
            echo "release_binding_revision=$APPLICATION_REVISION"
          } >> "$GITHUB_OUTPUT"
      - name: Stage this run's fresh evidence as a store candidate
        # Trusted refs only; PR runs never produce a trusted baseline. The
        # candidate becomes trusted only after every gate and the whole run passed.
        if: >-
          ${{ !startsWith(github.event_name, 'pull_request') &&
              (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
               startsWith(github.ref, 'refs/tags/')) }}
        run: >-
          python3 docs/scripts/manuale_timing.py stage evidence-store-candidate --
          python3 docs/scripts/manuale-cache.py store-publish --run "$RUNNER_TEMP/manuale-run"
          --store "$RUNNER_TEMP/manuale-store-candidate"
      - name: Retain the store candidate for the post-gate publisher
        if: >-
          ${{ !startsWith(github.event_name, 'pull_request') &&
              (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
               startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@v4
        with:
          name: manuale-evidence-store-candidate
          path: |
            ${{ runner.temp }}/manuale-store-candidate/index.json
            ${{ runner.temp }}/manuale-store-candidate/workflows/
            ${{ runner.temp }}/manuale-store-candidate/blobs/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3
      - name: Remove only this run's fixture services
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/manuale-run/run.json" ]]; then
            python3 docs/scripts/manuale-ci.py phase --run "$RUNNER_TEMP/manuale-run" --phase cleanup
          fi
      - name: Seal verified reusable baseline
        id: seal
        run: >-
          python3 docs/scripts/manuale-ci.py phase --run "$RUNNER_TEMP/manuale-run"
          --phase baseline --output "$RUNNER_TEMP/manuale-baseline.tar.gz"
      - name: Retain candidate baseline for successful-run admission
        # Skipped when every workflow and page reused admitted evidence, and on
        # every pull request run: only trusted-ref producers (default branch or
        # release tag; push, release, dispatch or schedule) may be admitted, so
        # a PR run never uploads an artifact under the admitted baseline name.
        if: >-
          ${{ steps.seal.outputs.sealed == 'true' &&
              !startsWith(github.event_name, 'pull_request') &&
              (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
               startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@v4
        with:
          name: manuale-verified-baseline
          path: ${{ runner.temp }}/manuale-baseline.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Upload exact runtime package
        uses: actions/upload-artifact@v4
        with:
          name: manuale-release-runtime
          path: ${{ runner.temp }}/manuale-package/runtime/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Export sanitized diagnostics
        if: always()
        run: python3 docs/scripts/manuale-diagnostics.py --run "$RUNNER_TEMP/manuale-run"
      - name: Retain decisions, timings and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuale-verification
          path: |
            ${{ runner.temp }}/manual-source.json
            ${{ runner.temp }}/baseline-admission.json
            ${{ runner.temp }}/manuale-run/ci-plan.json
            ${{ runner.temp }}/manuale-run/ci-results.json
            ${{ runner.temp }}/manuale-run/timings.json
            ${{ runner.temp }}/manuale-run/coverage.json
            ${{ runner.temp }}/manuale-run/render.json
            ${{ runner.temp }}/manuale-run/render-reuse.json
            ${{ runner.temp }}/manuale-run/evaluation.json
            ${{ runner.temp }}/manuale-run/embedded-manual.json
            ${{ runner.temp }}/manuale-run/release-binding.json
            ${{ runner.temp }}/manuale-run/release-binding-verification.json
            ${{ runner.temp }}/manuale-run/evidence-reuse.json
            ${{ runner.temp }}/manuale-store/store-restore.json
            ${{ runner.temp }}/manuale-store/store-plan.json
            ${{ runner.temp }}/manuale-run/export/
            ${{ runner.temp }}/manuale-run/diagnostics-public/
            ${{ runner.temp }}/manuale-package/publication-plan.json
            ${{ runner.temp }}/manuale-timing.jsonl
            ${{ runner.temp }}/manuale-cache.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Summarize stages, cache decisions and artifact sizes
        if: always()
        run: |
          python3 docs/scripts/manuale-ci.py report --run "$RUNNER_TEMP/manuale-run" \
            --admission "$RUNNER_TEMP/baseline-admission.json" --output "$RUNNER_TEMP/manuale-cache.json" \
            --store-plan "$RUNNER_TEMP/manuale-store/store-plan.json" || true
          python3 docs/scripts/manuale_timing.py summary --title 'Manual verification' \
            --impact "$RUNNER_TEMP/manuale-impact/impact.json" --cache "$RUNNER_TEMP/manuale-cache.json" \
            --artifact "verified baseline=$RUNNER_TEMP/manuale-baseline.tar.gz" \
            --artifact "evidence store (restored)=$RUNNER_TEMP/manuale-store/store" \
            --artifact "evidence store candidate=$RUNNER_TEMP/manuale-store-candidate" \
            --artifact "runtime package=$RUNNER_TEMP/manuale-package/runtime" \
            --artifact "verification export=$RUNNER_TEMP/manuale-run/export"

  appliance:
    name: ${{ needs.verify.outputs.appliance_scope == 'full' && format('Historical appliance rehearsal ({0})', matrix.part) || 'Package startup, reader and access checks' }}
    needs: verify
    if: ${{ needs.verify.outputs.appliance_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # The current and historical sequences share no state: each runner builds
      # what it needs, so one failing part must never cancel the other.
      fail-fast: false
      matrix:
        # A full rehearsal splits into its two independent sequences; every
        # other scope keeps the single compatibility run, exactly as before.
        part: ${{ fromJSON(needs.verify.outputs.appliance_scope == 'full' && '["current","historical"]' || '["all"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: selfhost/tests/browser/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/manuale/requirements-offline.txt
      - name: Record stage timings for this job
        run: echo "MANUALE_TIMING_FILE=$RUNNER_TEMP/manuale-timing.jsonl" >> "$GITHUB_ENV"
      - uses: ./.github/actions/prepare-storage
        with:
          legacy: ${{ needs.verify.outputs.appliance_scope == 'full' }}
      - uses: actions/download-artifact@v4
        with:
          name: manuale-release-runtime
          path: ${{ runner.temp }}/manuale-runtime
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('selfhost/tests/browser/package-lock.json') }}
      - name: Install package verification dependencies
        run: >-
          python3 docs/scripts/manuale_timing.py stage install-dependencies --
          bash -c 'python3 -m pip install -r docs/manuale/requirements-offline.txt
          && npm --prefix selfhost/tests/browser ci
          && npm exec --prefix selfhost/tests/browser -- playwright install --with-deps chromium'
      - name: Verify the exact packaged release on an isolated appliance
        env:
          RELEASE_VERSION: ${{ inputs.release }}
          CHECK_SCOPE: ${{ needs.verify.outputs.appliance_scope == 'full' && 'full' || 'compatibility' }}
          PART: ${{ matrix.part }}
        run: >-
          python3 docs/scripts/manuale_timing.py stage "appliance-$CHECK_SCOPE" --
          python3 selfhost/tests/manual-release-smoke.py "$RUNNER_TEMP/manuale-runtime"
          "$RELEASE_VERSION" --scope "$CHECK_SCOPE" --part "$PART" --previous-release 1.0.17
      - name: Retain appliance results and phase timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # A full run publishes each part under its own name for the merge; the
          # single compatibility run keeps uploading the final artifact name.
          name: ${{ needs.verify.outputs.appliance_scope == 'full' && format('manuale-release-evidence-{0}', matrix.part) || 'manuale-release-evidence' }}
          path: |
            quality-reports/manual-release/
            !quality-reports/manual-release/private-execution.log
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Summarize appliance timings
        if: always()
        run: python3 docs/scripts/manuale_timing.py summary --title 'Manual appliance'

  appliance-merge:
    name: Merge current and historical appliance results
    # verify must be a direct dependency: `needs` only exposes direct jobs.
    needs: [verify, appliance]
    # Only the split full run needs a merge; the compatibility run already
    # uploaded the final artifact, and a failed part leaves nothing to merge.
    if: ${{ needs.verify.outputs.appliance_required == 'true' && needs.verify.outputs.appliance_scope == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download the current part results
        uses: actions/download-artifact@v4
        with:
          name: manuale-release-evidence-current
          path: ${{ runner.temp }}/manuale-release-current
      - name: Download the historical part results
        uses: actions/download-artifact@v4
        with:
          name: manuale-release-evidence-historical
          path: ${{ runner.temp }}/manuale-release-historical
      - name: Merge the current and historical results
        # Reads both results.json only; logs, fixtures and browser artifacts
        # stay in the part artifacts and are never republished.
        run: >-
          python3 selfhost/tests/manual-release-merge.py
          --current "$RUNNER_TEMP/manuale-release-current"
          --historical "$RUNNER_TEMP/manuale-release-historical"
          --output quality-reports/manual-release
      - name: Upload the merged appliance results
        uses: actions/upload-artifact@v4
        with:
          # The gate keeps reading this name, so its results.json path is unchanged.
          name: manuale-release-evidence
          path: |
            quality-reports/manual-release/
            !quality-reports/manual-release/private-execution.log
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  gate:
    name: Manual verification gate
    # Runs after failures and cancellations too, so that a missing, skipped or
    # failed mandatory job can never leave this reusable workflow "successful".
    needs: [contracts, capture-plan, capture, verify, appliance, appliance-merge]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download appliance results
        if: ${{ needs.appliance.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: manuale-release-evidence
          path: ${{ runner.temp }}/manuale-release-evidence
      - name: Require every mandatory verification for this exact release
        id: gate
        env:
          MANUALE_NEEDS_JSON: ${{ toJSON(needs) }}
          COMPREHENSIVE: ${{ inputs.comprehensive }}
          RELEASE_VERSION: ${{ inputs.release }}
          APPLICATION_REVISION: ${{ github.sha }}
        run: >-
          python3 docs/scripts/manuale-ci.py gate --comprehensive "$COMPREHENSIVE"
          --release "$RELEASE_VERSION" --revision "$APPLICATION_REVISION"
          --results "$RUNNER_TEMP/manuale-release-evidence/results.json"
          --output "$RUNNER_TEMP/manuale-gate.json"
