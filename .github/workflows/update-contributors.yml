name: Update Contributors

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributors:
    name: Update README contributors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Update README contributors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/contributors?per_page=100" --slurp \
            | jq -r 'add
              | map(select(.type == "User"))
              | map("<a href=\"\(.html_url)\"><img src=\"\(.avatar_url)&amp;s=64\" width=\"64\" height=\"64\" alt=\"@\(.login)\" title=\"@\(.login)\"></a>")
              | join("\n")' \
            > /tmp/contributors.html

          sed '/<!-- contributors:start -->/q' README.md > /tmp/README.md
          cat /tmp/contributors.html >> /tmp/README.md
          sed -n '/<!-- contributors:end -->/,$p' README.md >> /tmp/README.md
          mv /tmp/README.md README.md

      - name: Commit contributor changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "Contributor list is already up to date"
          else
            git commit -m "docs: update contributors"
            git push origin HEAD:main
          fi
