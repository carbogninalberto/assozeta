name: Self-host release quality

on:
  workflow_call:
    inputs:
      run_operations:
        description: Run the operational quality checks.
        required: false
        type: boolean
        default: true
      run_ui:
        description: Run browser and UI-specific operational checks.
        required: false
        type: boolean
        default: true
      run_upgrade:
        description: Run the full Linux upgrade and browser matrix.
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      run_operations:
        description: Run the operational quality checks.
        required: false
        type: boolean
        default: true
      run_ui:
        description: Run browser and UI-specific operational checks.
        required: false
        type: boolean
        default: true
      run_upgrade:
        description: Run the full Linux upgrade and browser matrix.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  operations:
    if: inputs.run_operations
    name: Backend tests and diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-storage
      - name: Prepare isolated backend test dependencies
        run: |
          ./selfhost/bin/assozeta dev-config
          docker build --target development -t assozeta-backend-dev BE
          ./selfhost/bin/assozeta dev-compose up -d --wait postgres redis minio
      - name: Verify owner APIs, integrations, migrations, email and diagnostic failures
        if: github.event_name != 'pull_request'
        run: |
          ./selfhost/bin/assozeta dev-compose run --rm --no-deps api python -m pytest instance/tests/ application/tests/test_stripe_availability.py application/tests/test_auth_views.py application/tests/test_signup_policy.py application/tests/test_impersonation.py application/tests/test_impersonation_websocket.py application/tests/test_create_instance_superuser.py -q
          python3 -m unittest discover -s selfhost/tests -p test_operational_diagnostics.py
      - name: Run backend regression suite
        if: github.event_name == 'pull_request'
        run: ./selfhost/bin/assozeta dev-compose run --rm --no-deps api python -m pytest -q
      - name: Remove isolated services
        if: always()
        run: ./selfhost/bin/assozeta dev-compose down -v --remove-orphans

  ui:
    name: UI tests and operational browser checks
    if: inputs.run_ui
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASSOZETA_BROWSER_OUTPUT: ${{ github.workspace }}/quality-reports/operations-ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            UI/package-lock.json
            selfhost/tests/browser/package-lock.json
      - name: Verify forms and responsive operational settings
        run: |
          npm ci --prefix UI
          npm ci --prefix selfhost/tests/browser
          npm exec --prefix selfhost/tests/browser -- playwright install --with-deps --only-shell chromium
          cd UI
          npm test
          cd ..
          node selfhost/tests/browser/operations-ui.mjs
          node selfhost/tests/browser/data-restore-ui.mjs
          node UI/scripts/test-data-management-navigation.mjs
          node UI/scripts/test-administration.mjs
      - name: Verify full application reload behind Caddy
        working-directory: selfhost/tests/browser
        env:
          ASSOZETA_RELOAD_BROWSER_OUTPUT: ${{ github.workspace }}/quality-reports/reload-ui
        run: npm exec -- playwright test --config self-instance-reload.config.js
      - name: Retain fixture screenshots and acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-operations-${{ github.sha }}
          path: |
            quality-reports/administration/*.png
            quality-reports/operations-ui/*.json
            quality-reports/operations-ui/*.png
            quality-reports/data-restore-ui/*.json
            quality-reports/data-restore-ui/*.png
            quality-reports/reload-ui/**/*.png
          if-no-files-found: warn
          retention-days: 14

  bakney-sso:
    name: Bakney SSO contract and HTTPS browser checks
    if: inputs.run_operations || inputs.run_ui
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            UI/package-lock.json
            selfhost/tests/browser/package-lock.json
      - uses: ./.github/actions/prepare-storage
      - name: Prepare isolated SSO fixtures
        run: |
          ./selfhost/bin/assozeta dev-config
          docker build --target development -t assozeta-backend-dev BE
          ./selfhost/bin/assozeta dev-compose up -d --wait postgres redis minio
          npm ci --prefix UI
          npm ci --prefix selfhost/tests/browser
          npm exec --prefix selfhost/tests/browser -- playwright install --with-deps --only-shell chromium
          npm run build:vite:production --prefix UI
      - name: Exercise pairing and login across separate HTTPS sites
        run: |
          # Bakney's registered receiver origin must use standard HTTPS port 443.
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
          node selfhost/tests/browser/bakney-sso.mjs
      - name: Retain safe SSO browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bakney-sso-${{ github.sha }}
          path: |
            quality-reports/bakney-sso/*.json
            quality-reports/bakney-sso/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Remove isolated services
        if: always()
        run: ./selfhost/bin/assozeta dev-compose down -v --remove-orphans

  upgrade:
    if: inputs.run_upgrade
    name: Linux ${{ matrix.scenario }} and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [legacy, recovery]
    env:
      # `runner` is unavailable in a job-level `env` expression. Keep the
      # browser cache inside the checked-out workspace instead.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/quality-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: selfhost/tests/browser/package-lock.json
      - uses: ./.github/actions/prepare-storage
        with:
          legacy: 'true'
      - uses: docker/setup-buildx-action@v3
      # Keep separate caches for each image. Both scenarios still build the
      # checked-out source; cached layers never replace the test execution.
      - name: Build backend test image
        uses: docker/build-push-action@v6
        with:
          context: ./BE
          load: true
          tags: assozeta-backend:goal-test
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=quality-backend
          cache-to: type=gha,mode=max,scope=quality-backend
      - name: Build web test image
        uses: docker/build-push-action@v6
        with:
          context: ./UI
          load: true
          tags: assozeta-web:goal-test
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=quality-web
          cache-to: type=gha,mode=max,scope=quality-web
      - name: Build renderer test image
        uses: docker/build-push-action@v6
        with:
          context: ./selfhost/renderer
          load: true
          tags: assozeta-renderer:test
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=quality-renderer
          cache-to: type=gha,mode=max,scope=quality-renderer
      - name: Build updater test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./selfhost/updater/Dockerfile
          load: true
          tags: assozeta-updater:goal-test
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=quality-updater
          cache-to: type=gha,mode=max,scope=quality-updater
      - name: Run disposable upgrade and browser verification
        env:
          ASSOZETA_QUALITY_REPORT_DIR: ${{ github.workspace }}/quality-reports
        run: ./selfhost/tests/quality.sh '${{ matrix.scenario }}' --prepared-images
      - name: Retain safe evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-quality-${{ matrix.scenario }}-${{ github.sha }}
          path: |
            quality-reports/*.json
            quality-reports/**/*.png
          if-no-files-found: warn
          retention-days: 14
