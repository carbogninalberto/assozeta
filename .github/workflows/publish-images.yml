name: Build and publish images

on:
  push:
    branches: [main]
    paths:
      - "BE/**"
      - "BE_GO/**"
      - "TESTS/**"
      - ".github/workflows/go-quality.yml"
      - ".github/actions/go-foundation-setup/**"
      - "UI/**"
      - "selfhost/**"
      - "tools/release/**"
      - ".github/workflows/publish-images.yml"
      - ".github/actions/prepare-storage/**"
      - ".github/workflows/selfhost-quality.yml"
      - ".github/workflows/selfhost-release-rehearsal.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Existing release tag to (re)publish, for example v1.0.28. Run the
          workflow from that tag. Empty publishes commit images only.
        type: string
        default: ""
      include_manual:
        description: Build, verify and bundle the manual (slow); releases skip it otherwise
        type: boolean
        default: false
      force_full_manual:
        description: With include_manual, force full manual verification and historical appliance rehearsal
        type: boolean
        default: false
      include_arm64:
        description: >-
          Also build linux/arm64 images in addition to linux/amd64; pushes and
          releases always build linux/amd64 only
        type: boolean
        default: false

permissions:
  contents: read

# Releases publish without rebuilding the manual: both backend images carry the
# verified manual of the previous release unchanged (MANUAL_CARRIED_FROM). The
# manual is rebuilt, verified and bundled only on an explicit manual dispatch
# with include_manual.
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || (github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  go-quality:
    uses: ./.github/workflows/go-quality.yml

  release-target:
    name: Check release target
    if: github.event_name == 'release' || inputs.release_tag || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    steps:
      - name: Require the workflow to run from the release tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -eu
          case "$RELEASE_TAG" in v[0-9]*) ;; *) echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1 ;; esac
          if [ "$REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "Run this workflow from the tag (Use workflow from: $RELEASE_TAG); got $REF" >&2
            exit 1
          fi

  manual-release:
    if: github.event_name == 'workflow_dispatch' && inputs.include_manual
    uses: ./.github/workflows/manuale-release.yml
    permissions:
      contents: read
      actions: read
    with:
      release: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      force_full: ${{ inputs.force_full_manual || false }}
      # Published below, after authorization but outside the image chain.
      evidence_store: false

  manual-evidence-store:
    # Evidence-store publishing is an optimization for later runs: it starts
    # only after the release manual was authorized, and no publication job
    # depends on it, so it can never delay or block image publication.
    name: Publish trusted per-workflow manual evidence
    needs: manual-release
    if: ${{ needs.manual-release.result == 'success' && !startsWith(github.event_name, 'pull_request') }}
    uses: ./.github/workflows/manuale-evidence-publish.yml
    permissions:
      contents: read
      actions: read

  selfhost-quality:
    # PRs run affected checks separately; pushes only need the smoke/static gates.
    if: github.event_name != 'push' || github.ref_type == 'tag'
    uses: ./.github/workflows/selfhost-quality.yml

  validate:
    name: Validate self-host stack
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Legacy suites read the historical dual-API distribution from git history.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/prepare-storage

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the updater's Compose parser
        run: python3 -m pip install "$(grep '^PyYAML==' BE/requirements.txt)"
      - name: Run static self-host validation
        run: make selfhost-test

      - name: Run development smoke test
        run: make selfhost-smoke

  candidate-images:
    name: Build candidate ${{ matrix.name }}
    needs: [release-target, manual-release]
    if: >-
      ${{ !cancelled() && needs.release-target.result == 'success' &&
          (needs.manual-release.result == 'success' ||
           (!(github.event_name == 'workflow_dispatch' && inputs.include_manual) && needs.manual-release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: assozeta-backend
            context: ./BE
            file: ./BE/Dockerfile
            target: production
          - name: backend-go
            image: assozeta-backend-go
            context: ./BE_GO
            file: ./BE_GO/Dockerfile
            target: ""
          - name: web
            image: assozeta-web
            context: ./UI
            file: ./UI/Dockerfile
            target: production
          - name: renderer
            image: assozeta-renderer
            context: ./selfhost/renderer
            file: ./selfhost/renderer/Dockerfile
            target: ""
          - name: updater
            image: assozeta-updater
            context: .
            file: ./selfhost/updater/Dockerfile
            target: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the verified release manual
        if: (matrix.name == 'backend' || matrix.name == 'backend-go') && needs.manual-release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: manuale-release-runtime
          path: ${{ matrix.context }}/release-manual

      - name: Carry the manual of the previous release
        # Releases without include_manual reuse the verified manual of the
        # current :latest release image unchanged (it may itself be carried).
        id: carried
        if: (matrix.name == 'backend' || matrix.name == 'backend-go') && needs.manual-release.result != 'success' && env.RELEASE_TAG != ''
        env:
          SOURCE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          DESTINATION: ${{ matrix.context }}/release-manual
        run: |
          set -euo pipefail
          if ! docker pull --quiet "$SOURCE_IMAGE"; then
            echo "::warning::No previous release image; publishing without a manual"
            exit 0
          fi
          container=$(docker create "$SOURCE_IMAGE")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          work=$(mktemp -d)
          # The image directory is read-only: stream it and make the copy writable.
          docker cp "$container:/app/release-manual" - | tar -x -C "$work"
          chmod -R u+rwX "$work/release-manual"
          if [ ! -f "$work/release-manual/bundle.json" ]; then
            echo "::warning::$SOURCE_IMAGE has no manual; publishing without a manual"
            exit 0
          fi
          origin=$(python3 -c 'import json,sys; b=json.load(open(sys.argv[1])); print(b["release"], b["application_revision"])' "$work/release-manual/bundle.json")
          find "$DESTINATION" -mindepth 1 ! -name .gitkeep -exec rm -rf {} +
          cp -a "$work/release-manual/." "$DESTINATION/"
          echo "Carrying the manual verified for $origin"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch' && inputs.include_arm64
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' && !github.event.release.prerelease }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_arm64) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ env.RELEASE_TAG != '' && format('ghcr.io/{0}/{1}:candidate-{2}-{3}', github.repository_owner, matrix.image, github.run_id, github.run_attempt) || steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG || github.sha }}
            CODE_REVISION=${{ github.sha }}
            REQUIRE_MANUAL=${{ needs.manual-release.result == 'success' || steps.carried.outputs.origin != '' }}
            MANUAL_CARRIED_FROM=${{ steps.carried.outputs.origin }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

      - name: Record the built manifest digest
        if: env.RELEASE_TAG != ''
        env:
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.name }}
        run: printf '%s@%s\n' "${REPOSITORY,,}" "$DIGEST" > "$RUNNER_TEMP/$IMAGE"
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG != ''
        with:
          name: image-digest-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}
          if-no-files-found: error

  release-candidate:
    needs: candidate-images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.candidate.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Package the distribution and bind the candidate
        id: candidate
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p "$RUNNER_TEMP/package" "$RUNNER_TEMP/candidate"
          git archive HEAD selfhost | tar -x -C "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/package"
          sed -i "s|ghcr.io/carbogninalberto/assozeta-|ghcr.io/${IMAGE_OWNER,,}/assozeta-|g" \
            selfhost/bin/assozeta selfhost/compose.yml selfhost/.env.example
          archive="$RUNNER_TEMP/candidate/assozeta-selfhost-$RELEASE_TAG.tar.gz"
          tar -czf "$archive" selfhost
          cd "$GITHUB_WORKSPACE"
          python3 -B tools/release/qualify.py candidate --images "$RUNNER_TEMP/digests" \
            --version "$RELEASE_TAG" --bundle "$archive" --output "$RUNNER_TEMP/candidate/candidate.json"
          echo "images=$(jq -c .images "$RUNNER_TEMP/candidate/candidate.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error

  release-contracts:
    needs: release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/TESTS/adapters/django/constraints-parity.txt
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go-foundation-setup
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-candidate
          path: ${{ runner.temp }}/candidate
      - name: Run the simulated handoff contracts
        run: |
          docker pull "$(sed -n 's/^FROM \(caddy:[^ ]*\) AS production$/\1/p' UI/Dockerfile)"
          python3 -c 'import subprocess; from TESTS.adapters.django.s3_objects import IMAGE; subprocess.run(["docker", "pull", IMAGE], check=True)'
          modules=()
          for file in TESTS/handoff/test_*.py; do
            [[ $file == *_installed.py || $file == */test_p7_legacy.py ]] && continue
            module=${file%.py}
            modules+=("${module//\//.}")
          done
          started=$(date -u +%FT%TZ)
          report="$RUNNER_TEMP/contracts.json"
          python3 -B -m TESTS.handoff.run_expected_red --report "$report" "${modules[@]}" || test -s "$report"
          python3 -B tools/release/qualify.py receipt --lane contracts --report "$report" \
            --candidate "$RUNNER_TEMP/candidate/candidate.json" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --started-at "$started" --finished-at "$(date -u +%FT%TZ)" --output "$RUNNER_TEMP/receipts/contracts.json"
      - uses: actions/upload-artifact@v4
        with:
          name: receipts-contracts
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: error

  release-installed:
    needs: [release-candidate, selfhost-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      ASSOZETA_HANDOFF_P5_IMAGES: ${{ needs.release-candidate.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-candidate
          path: ${{ runner.temp }}/candidate
      - name: Install the candidate distribution and pull its exact images
        run: |
          cd "$RUNNER_TEMP/candidate"
          archive="assozeta-selfhost-$RELEASE_TAG.tar.gz"
          echo "$(jq -r .bundle_sha256 candidate.json)  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE"
          version=${RELEASE_TAG#v}
          echo "ASSOZETA_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          while read -r name ref; do
            docker pull "$ref"
            docker tag "$ref" "assozeta-$name:$version"
            if [[ $name == renderer ]]; then docker tag "$ref" assozeta-renderer:test; fi
            if [[ $name == updater ]]; then docker tag "$ref" "${ref%@*}:$version"; fi
          done < <(jq -r '.images | to_entries[] | [.key,.value] | @tsv' candidate.json)
      - uses: ./.github/actions/prepare-storage
        with:
          legacy: 'true'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the forward lane browser
        run: |
          npm ci --prefix selfhost/tests/browser
          npm exec --prefix selfhost/tests/browser -- playwright install --with-deps chromium
      - name: Rehearse the Django lifecycle with the candidate images
        env:
          QUALITY: ${{ needs.selfhost-quality.result }}
        run: |
          started=$(date -u +%FT%TZ)
          make SELFHOST_PREBUILT_IMAGES=1 selfhost-production-smoke
          test "$QUALITY" = success
          jq -n --arg revision "$(git rev-parse HEAD)" \
            '{ $revision, tests: {"make selfhost-production-smoke": {state:"pass"}, "selfhost-quality": {state:"pass"}} }' \
            > "$RUNNER_TEMP/smoke.json"
          python3 -B tools/release/qualify.py receipt --lane django_mode_lifecycle --report "$RUNNER_TEMP/smoke.json" \
            --candidate "$RUNNER_TEMP/candidate/candidate.json" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --started-at "$started" --finished-at "$(date -u +%FT%TZ)" --output "$RUNNER_TEMP/receipts/django_mode_lifecycle.json"
      - name: Exercise both installed runtimes, recovery and legacy upgrades
        env:
          ASSOZETA_RELEASE_OBSERVATIONS: ${{ runner.temp }}/observations
        run: |
          started=$(date -u +%FT%TZ)
          report="$RUNNER_TEMP/installed.json"
          python3 -B -m TESTS.handoff.run_expected_red --report "$report" \
            TESTS.handoff.test_p5_installed TESTS.handoff.test_p6_installed TESTS.handoff.test_p7_installed TESTS.handoff.test_p7_legacy || test -s "$report"
          finished=$(date -u +%FT%TZ)
          for lane in fresh_round_trip failure_recovery go_mode_lifecycle steady_state legacy_mixed_upgrade; do
            observations=()
            for file in "$ASSOZETA_RELEASE_OBSERVATIONS/$lane.json" "$ASSOZETA_RELEASE_OBSERVATIONS/$lane"-*.json; do
              if [[ -f $file ]]; then observations+=(--observations "$file"); fi
            done
            python3 -B tools/release/qualify.py receipt --lane "$lane" --report "$report" "${observations[@]}" \
              --candidate "$RUNNER_TEMP/candidate/candidate.json" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --started-at "$started" --finished-at "$finished" --output "$RUNNER_TEMP/receipts/$lane.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: receipts-installed
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: error

  release-qualification:
    needs: [release-contracts, release-installed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: receipts-*
          path: ${{ runner.temp }}/receipts
          merge-multiple: true
      - name: Qualify the candidate on its clean source checkout
        run: |
          python3 -B tools/release/qualify.py check --candidate "$RUNNER_TEMP/candidate/candidate.json" \
            --receipts "$RUNNER_TEMP/receipts" --output "$RUNNER_TEMP/assozeta-release-qualification.json"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: release-qualification
          path: ${{ runner.temp }}/assozeta-release-qualification.json
          if-no-files-found: error

  production-smoke:
    name: Run production smoke suite
    needs: release-installed
    if: >-
      ${{ !cancelled() && (needs.release-installed.result == 'success' ||
          (github.event_name != 'release' && !inputs.release_tag && !(github.event_name == 'push' && github.ref_type == 'tag') && needs.release-installed.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        if: env.RELEASE_TAG == ''
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - if: env.RELEASE_TAG == ''
        uses: ./.github/actions/prepare-storage

      - name: Build production images and run smoke test
        if: env.RELEASE_TAG == ''
        run: make selfhost-production-smoke

      - name: Confirm the candidate smoke receipt
        if: env.RELEASE_TAG != ''
        uses: actions/download-artifact@v4
        with:
          name: receipts-installed
          path: ${{ runner.temp }}/receipts
      - if: env.RELEASE_TAG != ''
        run: jq -e '.tests["make selfhost-production-smoke"] == "passed"' "$RUNNER_TEMP/receipts/django_mode_lifecycle.json"

  publish:
    name: Publish ${{ matrix.name }}
    needs: [release-qualification, validate, production-smoke, selfhost-quality, manual-release, release-target, go-quality]
    if: >-
      ${{ !cancelled() && needs.release-qualification.result == 'success' &&
          needs.production-smoke.result == 'success' &&
          needs.validate.result == 'success' && needs.go-quality.result == 'success' &&
          needs.selfhost-quality.result == 'success' && needs.release-target.result == 'success' &&
          (needs.manual-release.result == 'success' ||
           (!(github.event_name == 'workflow_dispatch' && inputs.include_manual) && needs.manual-release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: assozeta-backend
            context: ./BE
            file: ./BE/Dockerfile
            target: production
          - name: backend-go
            image: assozeta-backend-go
            context: ./BE_GO
            file: ./BE_GO/Dockerfile
            target: ""
          - name: web
            image: assozeta-web
            context: ./UI
            file: ./UI/Dockerfile
            target: production
          - name: renderer
            image: assozeta-renderer
            context: ./selfhost/renderer
            file: ./selfhost/renderer/Dockerfile
            target: ""
          - name: updater
            image: assozeta-updater
            context: .
            file: ./selfhost/updater/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' && !github.event.release.prerelease }}
      - uses: actions/download-artifact@v4
        with:
          name: release-qualification
          path: ${{ runner.temp }}/qualification
      - name: Promote qualified image
        env:
          IMAGE: ${{ matrix.name }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          python3 -B tools/release/qualify.py promote --image "$IMAGE" --tags "$TAGS" \
            --qualification "$RUNNER_TEMP/qualification/assozeta-release-qualification.json"

  branch-images:
    name: Publish commit image ${{ matrix.name }}
    needs: [release-qualification, validate, production-smoke, selfhost-quality, manual-release, release-target, go-quality]
    if: >-
      ${{ !cancelled() && github.event_name != 'release' && !inputs.release_tag &&
          !(github.event_name == 'push' && github.ref_type == 'tag') &&
          needs.release-qualification.result == 'skipped' && needs.release-target.result == 'skipped' &&
          needs.validate.result == 'success' && needs.go-quality.result == 'success' &&
          needs.production-smoke.result == 'success' &&
          (needs.selfhost-quality.result == 'success' ||
           (github.event_name == 'push' && needs.selfhost-quality.result == 'skipped')) &&
          (needs.manual-release.result == 'success' ||
           (!(github.event_name == 'workflow_dispatch' && inputs.include_manual) && needs.manual-release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: assozeta-backend
            context: ./BE
            file: ./BE/Dockerfile
            target: production
          - name: backend-go
            image: assozeta-backend-go
            context: ./BE_GO
            file: ./BE_GO/Dockerfile
            target: ""
          - name: web
            image: assozeta-web
            context: ./UI
            file: ./UI/Dockerfile
            target: production
          - name: renderer
            image: assozeta-renderer
            context: ./selfhost/renderer
            file: ./selfhost/renderer/Dockerfile
            target: ""
          - name: updater
            image: assozeta-updater
            context: .
            file: ./selfhost/updater/Dockerfile
            target: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the verified release manual
        if: (matrix.name == 'backend' || matrix.name == 'backend-go') && needs.manual-release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: manuale-release-runtime
          path: ${{ matrix.context }}/release-manual

      - name: Carry the manual of the previous release
        # Releases without include_manual reuse the verified manual of the
        # current :latest release image unchanged (it may itself be carried).
        id: carried
        if: (matrix.name == 'backend' || matrix.name == 'backend-go') && needs.manual-release.result != 'success' && env.RELEASE_TAG != ''
        env:
          SOURCE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          DESTINATION: ${{ matrix.context }}/release-manual
        run: |
          set -euo pipefail
          if ! docker pull --quiet "$SOURCE_IMAGE"; then
            echo "::warning::No previous release image; publishing without a manual"
            exit 0
          fi
          container=$(docker create "$SOURCE_IMAGE")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          work=$(mktemp -d)
          # The image directory is read-only: stream it and make the copy writable.
          docker cp "$container:/app/release-manual" - | tar -x -C "$work"
          chmod -R u+rwX "$work/release-manual"
          if [ ! -f "$work/release-manual/bundle.json" ]; then
            echo "::warning::$SOURCE_IMAGE has no manual; publishing without a manual"
            exit 0
          fi
          origin=$(python3 -c 'import json,sys; b=json.load(open(sys.argv[1])); print(b["release"], b["application_revision"])' "$work/release-manual/bundle.json")
          find "$DESTINATION" -mindepth 1 ! -name .gitkeep -exec rm -rf {} +
          cp -a "$work/release-manual/." "$DESTINATION/"
          echo "Carrying the manual verified for $origin"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch' && inputs.include_arm64
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' && !github.event.release.prerelease }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_arm64) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ env.RELEASE_TAG != '' && format('ghcr.io/{0}/{1}:candidate-{2}-{3}', github.repository_owner, matrix.image, github.run_id, github.run_attempt) || steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG || github.sha }}
            CODE_REVISION=${{ github.sha }}
            REQUIRE_MANUAL=${{ needs.manual-release.result == 'success' || steps.carried.outputs.origin != '' }}
            MANUAL_CARRIED_FROM=${{ steps.carried.outputs.origin }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

      - name: Record the built manifest digest
        if: env.RELEASE_TAG != ''
        env:
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.name }}
        run: printf '%s@%s\n' "${REPOSITORY,,}" "$DIGEST" > "$RUNNER_TEMP/$IMAGE"
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG != ''
        with:
          name: image-digest-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}
          if-no-files-found: error

  verify-release-images:
    name: Verify release images are public
    if: ${{ !cancelled() && needs.publish.result == 'success' && (github.event_name == 'release' || inputs.release_tag || (github.event_name == 'push' && github.ref_type == 'tag')) }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-qualification
          path: ${{ runner.temp }}/qualification
      - uses: docker/setup-buildx-action@v3
      - name: Resolve release tags without registry credentials
        run: |
          python3 -B tools/release/qualify.py verify-published \
            --qualification "$RUNNER_TEMP/qualification/assozeta-release-qualification.json"

  release-bundle:
    name: Attach self-host bundle
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' &&
          needs.verify-release-images.result == 'success' &&
          (github.event_name == 'release' || inputs.release_tag || (github.event_name == 'push' && github.ref_type == 'tag')) }}
    needs: [publish, verify-release-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: selfhost-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: release-qualification
          path: ${{ runner.temp }}/qualification
      - name: Prepare the qualified release assets
        env:
          PYTHONPATH: BE/instance
        run: |
          archive="assozeta-selfhost-$RELEASE_TAG.tar.gz"
          cp "$RUNNER_TEMP/candidate/$archive" .
          cp "$RUNNER_TEMP/qualification/assozeta-release-qualification.json" .
          python3 selfhost/updater/build_manifest.py "$RELEASE_TAG" "$archive" assozeta-update.json
          jq -e --slurpfile q assozeta-release-qualification.json '
            .bundle_sha256 == $q[0].candidate.bundle_sha256 and
            (.images + {"backend-go": .extensions.go_backend.image}) == $q[0].candidate.images
          ' assozeta-update.json
      - name: Attach the archive, qualification and verified update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" "assozeta-selfhost-$RELEASE_TAG.tar.gz" assozeta-release-qualification.json --clobber
          gh release upload "$RELEASE_TAG" assozeta-update.json --clobber
