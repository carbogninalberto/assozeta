name: Build and publish images

on:
  push:
    branches: [main]
    paths:
      - "BE/**"
      - "UI/**"
      - "selfhost/**"
      - ".github/workflows/publish-images.yml"
      - ".github/actions/prepare-storage/**"
      - ".github/workflows/selfhost-quality.yml"
      - ".github/workflows/selfhost-release-rehearsal.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Existing release tag to (re)publish, for example v1.0.28. Run the
          workflow from that tag. Empty publishes commit images only.
        type: string
        default: ""
      include_manual:
        description: Build, verify and bundle the manual (slow); releases skip it otherwise
        type: boolean
        default: false
      force_full_manual:
        description: With include_manual, force full manual verification and historical appliance rehearsal
        type: boolean
        default: false

permissions:
  contents: read

# Releases publish without rebuilding the manual: the backend image carries the
# verified manual of the previous release unchanged (MANUAL_CARRIED_FROM). The
# manual is rebuilt, verified and bundled only on an explicit manual dispatch
# with include_manual.
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  release-target:
    name: Check release target
    if: github.event_name == 'release' || inputs.release_tag
    runs-on: ubuntu-latest
    steps:
      - name: Require the workflow to run from the release tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -eu
          case "$RELEASE_TAG" in v[0-9]*) ;; *) echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1 ;; esac
          if [ "$REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "Run this workflow from the tag (Use workflow from: $RELEASE_TAG); got $REF" >&2
            exit 1
          fi

  manual-release:
    if: github.event_name == 'workflow_dispatch' && inputs.include_manual
    uses: ./.github/workflows/manuale-release.yml
    permissions:
      contents: read
      actions: read
    with:
      release: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      force_full: ${{ inputs.force_full_manual || false }}
      # Published below, after authorization but outside the image chain.
      evidence_store: false

  manual-evidence-store:
    # Evidence-store publishing is an optimization for later runs: it starts
    # only after the release manual was authorized, and no publication job
    # depends on it, so it can never delay or block image publication.
    name: Publish trusted per-workflow manual evidence
    needs: manual-release
    if: ${{ needs.manual-release.result == 'success' && !startsWith(github.event_name, 'pull_request') }}
    uses: ./.github/workflows/manuale-evidence-publish.yml
    permissions:
      contents: read
      actions: read

  selfhost-quality:
    # PRs run affected checks separately; pushes only need the smoke/static gates.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/selfhost-quality.yml

  validate:
    name: Validate self-host stack
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-storage

      - name: Run static self-host validation
        run: make selfhost-test

      - name: Run development smoke test
        run: make selfhost-smoke

  production-smoke:
    name: Run production smoke suite
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-storage

      - name: Build production images and run smoke test
        run: make selfhost-production-smoke

  publish:
    name: Publish ${{ matrix.name }}
    # A skipped full-quality job is expected only for branch pushes. Explicit
    # results keep failures/cancellation from bypassing the publication gates.
    # A requested manual must succeed; an unrequested one is skipped.
    if: >-
      ${{ !cancelled() &&
          needs.validate.result == 'success' &&
          needs.production-smoke.result == 'success' &&
          (needs.release-target.result == 'success' ||
           (github.event_name != 'release' && !inputs.release_tag && needs.release-target.result == 'skipped')) &&
          (needs.manual-release.result == 'success' ||
           (!(github.event_name == 'workflow_dispatch' && inputs.include_manual) && needs.manual-release.result == 'skipped')) &&
          (needs.selfhost-quality.result == 'success' ||
           (github.event_name == 'push' && needs.selfhost-quality.result == 'skipped')) }}
    needs: [validate, production-smoke, selfhost-quality, manual-release, release-target]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: assozeta-backend
            context: ./BE
            file: ./BE/Dockerfile
            target: production
          - name: web
            image: assozeta-web
            context: ./UI
            file: ./UI/Dockerfile
            target: production
          - name: renderer
            image: assozeta-renderer
            context: ./selfhost/renderer
            file: ./selfhost/renderer/Dockerfile
            target: ""
          - name: updater
            image: assozeta-updater
            context: .
            file: ./selfhost/updater/Dockerfile
            target: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the verified release manual
        if: matrix.name == 'backend' && needs.manual-release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: manuale-release-runtime
          path: BE/release-manual

      - name: Carry the manual of the previous release
        # Releases without include_manual reuse the verified manual of the
        # current :latest release image unchanged (it may itself be carried).
        id: carried
        if: matrix.name == 'backend' && needs.manual-release.result != 'success' && env.RELEASE_TAG != ''
        env:
          SOURCE_IMAGE: ghcr.io/${{ github.repository_owner }}/assozeta-backend:latest
        run: |
          set -euo pipefail
          if ! docker pull --quiet "$SOURCE_IMAGE"; then
            echo "::warning::No previous release image; publishing without a manual"
            exit 0
          fi
          container=$(docker create "$SOURCE_IMAGE")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          work=$(mktemp -d)
          # The image directory is read-only: stream it and make the copy writable.
          docker cp "$container:/app/release-manual" - | tar -x -C "$work"
          chmod -R u+rwX "$work/release-manual"
          if [ ! -f "$work/release-manual/bundle.json" ]; then
            echo "::warning::$SOURCE_IMAGE has no manual; publishing without a manual"
            exit 0
          fi
          origin=$(python3 -c 'import json,sys; b=json.load(open(sys.argv[1])); print(b["release"], b["application_revision"])' "$work/release-manual/bundle.json")
          find BE/release-manual -mindepth 1 ! -name .gitkeep -exec rm -rf {} +
          cp -a "$work/release-manual/." BE/release-manual/
          echo "Carrying the manual verified for $origin"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' && !github.event.release.prerelease }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG || github.sha }}
            CODE_REVISION=${{ github.sha }}
            REQUIRE_MANUAL=${{ needs.manual-release.result == 'success' || steps.carried.outputs.origin != '' }}
            MANUAL_CARRIED_FROM=${{ steps.carried.outputs.origin }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

  verify-release-images:
    name: Verify release images are public
    if: ${{ !cancelled() && needs.publish.result == 'success' && (github.event_name == 'release' || inputs.release_tag) }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify anonymous pull of release-tag images
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${RELEASE_TAG#v}"

          images=(assozeta-backend assozeta-web assozeta-renderer assozeta-updater)
          failures=()

          for image in "${images[@]}"; do
            repo="${IMAGE_OWNER}/${image}"
            ref="ghcr.io/${repo}:${RELEASE_TAG}"
            echo "Verifying anonymous pull of ${ref}"

            if ! token="$(curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"; then
              failures+=("${ref}")
              continue
            fi
            if ! curl -fsSL -o /dev/null \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${repo}/manifests/${RELEASE_TAG}"; then
              failures+=("${ref}")
            fi
          done

          if [ "${#failures[@]}" -gt 0 ]; then
            printf '\nAnonymous pull verification failed for:\n' >&2
            printf '  - %s\n' "${failures[@]}" >&2
            printf '\nGHCR container packages are private by default, but the self-host installer\n' >&2
            printf 'pulls images without credentials. Set all four packages to Public\n' >&2
            printf '(Package settings > Change visibility > Public), then rerun this workflow:\n' >&2
            printf '  - ghcr.io/%s/assozeta-backend\n' "${IMAGE_OWNER}" >&2
            printf '  - ghcr.io/%s/assozeta-web\n' "${IMAGE_OWNER}" >&2
            printf '  - ghcr.io/%s/assozeta-renderer\n' "${IMAGE_OWNER}" >&2
            printf '  - ghcr.io/%s/assozeta-updater\n' "${IMAGE_OWNER}" >&2
            exit 1
          fi

          echo "All four release images are anonymously pullable."

  release-bundle:
    name: Attach self-host bundle
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' &&
          needs.verify-release-images.result == 'success' &&
          (github.event_name == 'release' || inputs.release_tag) }}
    needs: [publish, verify-release-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set bundle image owner
        env:
          BUNDLE_IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          owner = os.environ["BUNDLE_IMAGE_OWNER"]
          replacement = f"ghcr.io/{owner}/assozeta-"
          for filename in (
              "selfhost/bin/assozeta",
              "selfhost/compose.yml",
              "selfhost/.env.example",
          ):
              path = Path(filename)
              path.write_text(path.read_text().replace("ghcr.io/carbogninalberto/assozeta-", replacement))
          PY

      - name: Create bundle
        run: tar -czf "assozeta-selfhost-$RELEASE_TAG.tar.gz" selfhost

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "assozeta-selfhost-$RELEASE_TAG.tar.gz" --clobber

      - name: Publish verified update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: BE/instance
        run: |
          python3 selfhost/updater/build_manifest.py "$RELEASE_TAG" "assozeta-selfhost-$RELEASE_TAG.tar.gz" assozeta-update.json
          gh release upload "$RELEASE_TAG" assozeta-update.json --clobber
