{% load instance_branding %}{% instance_brand_palette as brand %}
<!DOCTYPE html>
<html lang="it" xmlns:v="urn:schemas-microsoft-com:vml" style="font-family: 'Poppins', sans-serif">
<head>
  <meta charset="utf-8">
  <meta name="x-apple-disable-message-reformatting">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <!--[if mso]><style>td,th,div,p,a,h1,h2,h3,h4,h5,h6 {font-family: "Segoe UI", sans-serif; mso-line-height-rule: exactly;}</style><![endif]-->
  <title>{% block title %}{{ settings.WHITELABEL_NAME }}{% endblock %}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');
    * { font-family: 'Poppins', sans-serif; }
    .email-button { background-color: {{ brand.primary }}; color: {{ brand.foreground }}; }
    .hover-bg-indigo-500:hover { background-color: {{ brand.hover }} !important; }
    @media (max-width: 600px) {
      .sm-w-full { width: 100% !important; }
      .sm-py-8 { padding-top: 32px !important; padding-bottom: 32px !important; }
      .sm-px-6 { padding-left: 24px !important; padding-right: 24px !important; }
      .sm-leading-8 { line-height: 32px !important; }
    }
  </style>
</head>
<body style="font-family: 'Poppins', sans-serif; word-break: break-word; -webkit-font-smoothing: antialiased; margin: 0; width: 100%; background-color: #f8fafc; padding: 0">
  <div style="font-family: 'Poppins', sans-serif; display: none">{% block preheader %}{{ settings.WHITELABEL_NAME }}{% endblock %}</div>
  <div role="article" aria-roledescription="email" aria-label="{% block aria_label %}{{ settings.WHITELABEL_NAME }}{% endblock %}" lang="it" style="font-family: 'Poppins', sans-serif">
    <table style="width: 100%; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" cellpadding="0" cellspacing="0" role="presentation">
      <tr><td align="center" style="font-family: 'Poppins', sans-serif; background-color: #f8fafc">
        <table class="sm-w-full" style="font-family: 'Poppins', sans-serif; width: 600px" cellpadding="0" cellspacing="0" role="presentation">
          {% if settings.IS_WHITELABEL is False %}
          <tr><td class="sm-py-8 sm-px-6" style="font-family: 'Poppins', sans-serif; padding: 48px; text-align: center">
            <a href="https://bakney.com" style="font-family: 'Poppins', sans-serif"><img src="https://bakney.com/images/logo.png" width="200" alt="Bakney" style="font-family: 'Poppins', sans-serif; border: 0; max-width: 100%; vertical-align: middle"></a>
          </td></tr>
          {% endif %}
          <tr><td align="center" class="sm-px-6" style="font-family: 'Poppins', sans-serif">
            <table style="font-family: 'Poppins', sans-serif; width: 100%" cellpadding="0" cellspacing="0" role="presentation">
              <tr><td class="sm-px-6" style="font-family: 'Poppins', sans-serif; border-radius: 4px; background-color: #fff; padding: 48px; text-align: left; font-size: 16px; line-height: 24px; color: #334155; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05)">
                {% block content %}{% endblock %}
              </td></tr>
              <tr><td style="font-family: 'Poppins', sans-serif; height: 48px"></td></tr>
            </table>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </div>
</body>
</html>
